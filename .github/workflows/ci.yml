name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  tests:
    name: Test (Python ${{ matrix.python-version }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install CPU Torch
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,viz]"

      - name: Run Tests
        run: |
          pytest tests/ --cov=omniad --cov-report=xml

  wheel:
    name: Wheel Smoke Test
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build wheel
        run: |
          pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel
        run: |
          pip install dist/*.whl

      - name: Test installed wheel
        working-directory: /tmp
        run: |
          python - <<'PY'
          import numpy as np

          import omniad

          X = np.random.default_rng(0).normal(size=(30, 3))

          model = omniad.get_detector(
              "IsolationForest",
              random_state=0,
              n_jobs=1,
          ).fit(X)

          scores = model.predict_score(X)
          assert scores.shape == (30,)
          assert np.isfinite(scores).all()

          path = "/tmp/omniad-model.zip"
          model.save(path)

          loaded = omniad.get_detector("IsolationForest")
          loaded.load(path)

          np.testing.assert_allclose(
              loaded.predict_score(X),
              scores,
              rtol=1e-7,
          )
          PY
